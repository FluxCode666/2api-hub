# 2API Hub 生产部署（单一应用镜像 + postgres）
# 用法：docker compose -f deploy/docker-compose.prod.yml \
#   --env-file deploy/.env.prod up -d
# 应用镜像由 GLM-A 的根 Dockerfile 构建（含 supervisor + 迁移 + 三进程）

name: 2api-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: 2api-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - 2api-hub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hub]
    # 不映射宿主端口（仅内部网络）

  app:
    image: ghcr.io/fluxcode666/2api-hub:${HUB_IMAGE_TAG:?必须设置，如 v0.1.0}
    container_name: 2api-hub-app
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 单行书写（YAML 折叠 >- 会在换行处插入空格，导致连接串失效）；密码请用 URL 安全字符（如 openssl rand -hex 24）
      DATABASE_URL: postgres://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hub}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?必须设置，openssl rand -hex 32}
      SESSION_SECRET: ${SESSION_SECRET:?必须设置}
      ALLOW_PRIVATE_PROBE: ${ALLOW_PRIVATE_PROBE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      HUB_SITE_URL: ${HUB_SITE_URL:-http://127.0.0.1:3210}
      HUB_RELEASE_REPOSITORY: ${HUB_RELEASE_REPOSITORY:-FluxCode666/2api-hub}
      HUB_GITHUB_TOKEN: ${HUB_GITHUB_TOKEN:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
    volumes:
      - 2api-hub-data:/app/data
    ports:
      - "3210:3210"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:3210/api/v1/healthz || exit 1"
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [hub]

networks:
  hub:

volumes:
  2api-hub-pg:
  2api-hub-data:
